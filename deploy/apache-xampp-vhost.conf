# XAMPP local virtual host example. Adjust paths for your machine.
<VirtualHost *:80>
    ServerName inventory.test
    DocumentRoot "C:/xampp/htdocs/inventory-platform/public"
    <Directory "C:/xampp/htdocs/inventory-platform/public">
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "logs/inventory-error.log"
    CustomLog "logs/inventory-access.log" common
</VirtualHost>
